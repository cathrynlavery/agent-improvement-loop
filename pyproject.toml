[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-improvement-loop"
version = "0.3.0"
description = "Mine local Claude Code and Codex sessions for approval-gated self-improvement proposals."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Cathryn Lavery" }]
keywords = ["claude-code", "codex", "agents", "self-improvement", "transcripts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/cathrynlavery/agent-improvement-loop"
Issues = "https://github.com/cathrynlavery/agent-improvement-loop/issues"

[project.scripts]
agent-improvement-loop = "daily_improvement_loop:main"

[tool.setuptools]
package-dir = { "" = "scripts" }
py-modules = ["daily_improvement_loop"]
